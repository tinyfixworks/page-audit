name: Audit public page
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public Yettel page URL (https://www.yettel.bg/...)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run audit
        env:
          AUDIT_URL: ${{ inputs.url }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini
        run: python checker.py --url "$AUDIT_URL" --output results.json
      - uses: actions/upload-artifact@v4
        with:
          name: page-audit-report
          path: results.json
      - name: Commit latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          if git diff --cached --quiet; then echo "No report changes."; else git commit -m "Update page audit report"; git push; fi
